<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ job.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

<header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-6 py-6">
        <a href="{% url 'job_list' %}" class="text-blue-600 text-sm">
            ← الرجوع للوظائف
        </a>
    </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-10">

    <div class="bg-white rounded-2xl shadow-sm p-8">

        <h1 class="text-3xl font-bold mb-2">
            {{ job.title }}
        </h1>

        <p class="text-gray-500 mb-4">
            {{ job.company }} · {{ job.location }}
        </p>

        <span class="inline-block mb-6 px-4 py-1 text-sm font-semibold
                     bg-blue-100 text-blue-600 rounded-full">
            {{ job.source|upper }}
        </span>

        {% if job.description %}
        <div class="prose max-w-none leading-loose mb-8">
            {{ job.description|linebreaks }}
        </div>
        {% endif %}

        <a href="{{ job.url }}" target="_blank"
           class="inline-block bg-blue-600 text-white
                  px-8 py-3 rounded-xl font-semibold
                  hover:bg-blue-700 transition">
            التقديم على الوظيفة
        </a>

    </div>

</main>

<footer class="text-center text-sm text-gray-500 py-6">
    © {{ now|date:"Y" }} JobPlatform
</footer>

</body>
</html>
