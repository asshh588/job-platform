<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}درب للوظائف{% endblock %}</title>

  <!-- Google Font: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif'],
          },
          colors: {
            primary: {
              600: '#088395',   // اللون الأساسي
              700: '#09637E',   // الهيدر
            },
            secondary: {
              400: '#7AB2B2',
            },
            soft: '#EBF4F6',     // خلفيات
          }
        }
      }
    }
  </script>

  <style>
    * { font-family: 'Tajawal', sans-serif; }
  </style>
</head>

<body class="bg-soft min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-primary-700 border-b border-primary-600">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <div>
          <a href="{% url 'job_list' %}" class="text-2xl font-extrabold text-white">
            درب للوظائف
          </a>
          <p class="text-sm text-secondary-400 mt-0.5">
            جمعنا لك مواقع التوظيف في مكان واحد
          </p>
        </div>

        <nav class="hidden md:flex items-center gap-8">
          <a href="{% url 'job_list' %}" class="text-white/80 hover:text-white transition-colors font-medium">
            الوظائف
          <a href="{% url 'about' %}" class="text-white/80 hover:text-white transition-colors font-medium">
  عن المنصة
</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <div class="max-w-6xl mx-auto px-6 py-12">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-primary-600/20 mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="text-gray-500 text-sm">
          © {{ now|date:"Y" }} درب للوظائف. جميع الحقوق محفوظة.
        </div>
        <div class="flex items-center gap-6 text-sm">
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">سياسة الخصوصية</a>
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">الشروط والأحكام</a>
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">تواصل معنا</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
