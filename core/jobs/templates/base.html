<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}منصة الوظائف{% endblock %}</title>

  <!-- Google Font: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'tajawal': ['Tajawal', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Tajawal', sans-serif; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex items-center justify-between">
        <div>
          <a href="{% url 'job_list' %}" class="text-2xl font-bold text-primary-600">
            منصة الوظائف
          </a>
          <p class="text-sm text-gray-500 mt-0.5">اكتشف فرص العمل المناسبة لك</p>
        </div>

        <nav class="hidden md:flex items-center gap-8">
          <a href="{% url 'job_list' %}" class="text-gray-600 hover:text-primary-600 transition-colors font-medium">
            الوظائف
          </a>
          <!-- خله لاحقًا إذا سويت صفحة about -->
          <a href="#" class="text-gray-600 hover:text-primary-600 transition-colors font-medium">
            عن المنصة
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1">
    <div class="max-w-6xl mx-auto px-6 py-12">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-100 mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="text-gray-500 text-sm">
          © {{ now|date:"Y" }} منصة الوظائف. جميع الحقوق محفوظة.
        </div>
        <div class="flex items-center gap-6 text-sm">
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">سياسة الخصوصية</a>
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">الشروط والأحكام</a>
          <a href="#" class="text-gray-500 hover:text-primary-600 transition-colors">تواصل معنا</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
